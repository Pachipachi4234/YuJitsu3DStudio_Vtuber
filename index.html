<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YuJitsu Studio | WebCam Vtuber Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; overflow: hidden; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; }
        .input-ui { background: #010409; border: 1px solid #30363d; color: #c9d1d9; border-radius: 0.375rem; padding: 0.25rem 0.5rem; width: 100%; }
        .bg-btn { padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold; cursor: pointer; border: 1px solid #30363d; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-4 gap-4">

    <!-- ヘッダー -->
    <header class="flex justify-between items-center border-b border-[#30363d] pb-2 flex-none">
        <div>
            <h1 class="text-xl font-bold text-[#58a6ff]">YuJitsu Studio <span class="text-xs text-green-400 font-normal">Vtuber Mode</span></h1>
            <p class="text-xs text-gray-400">画像1枚で即VTuber！Webカメラトラッキング対応</p>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400">背景:</span>
            <button id="bgDark" class="bg-btn bg-[#0d1117] text-white">Dark</button>
            <button id="bgGreen" class="bg-btn bg-[#00ff00] text-black">GB (緑)</button>
            <button id="bgRed" class="bg-btn bg-[#ff0000] text-white">RB (赤)</button>
            <button id="bgBlue" class="bg-btn bg-[#0000ff] text-white">BB (青)</button>
            
            <div class="h-4 w-[1px] bg-[#30363d] mx-2"></div>

            <button id="startCamBtn" class="bg-[#238636] hover:bg-[#2ea043] text-white text-xs px-4 py-1.5 rounded font-bold transition">
                📹 Webカメラトラッキング開始
            </button>
        </div>
    </header>

    <!-- メインエリア -->
    <div class="flex-1 flex gap-4 min-h-0">
        <!-- 左パネル -->
        <div class="w-72 panel p-4 flex flex-col gap-4 overflow-y-auto flex-none">
            <div class="border-b border-[#30363d] pb-3 space-y-2">
                <h2 class="text-sm font-bold text-[#79c0ff]">🖼️ VTuber立ち絵設定</h2>
                <input type="file" id="imageInput" accept="image/*" class="input-ui text-xs cursor-pointer">
                <p class="text-[10px] text-gray-400">※画像を選ぶと即座に3D表示されます</p>
            </div>

            <!-- トラッキング設定 -->
            <div class="space-y-3 bg-[#010409] p-3 rounded border border-[#30363d]">
                <div class="text-xs font-bold text-gray-300">⚙️ トラッキング連動設定</div>
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400"><span>頭の回転感度</span><span id="headSensVal">1.2</span></div>
                    <input type="range" id="headSens" class="w-full" min="0.5" max="2.5" step="0.1" value="1.2">
                </div>
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400"><span>胴体の連動率</span><span id="bodySensVal">0.3</span></div>
                    <input type="range" id="bodySens" class="w-full" min="0" max="0.8" step="0.05" value="0.3">
                </div>
            </div>
        </div>

        <!-- 右：3Dビューポート -->
        <div class="flex-1 panel relative overflow-hidden flex flex-col">
            <div id="canvasContainer" class="w-full flex-1"></div>
            <video id="webcam" class="hidden" autoplay playsinline></video>
            <div id="statusBadge" class="absolute top-3 left-3 bg-[#010409]/90 px-3 py-1.5 rounded text-xs text-[#58a6ff] border border-[#30363d]">
                立ち絵画像を選択してください
            </div>
        </div>
    </div>

<script>
    const container = document.getElementById('canvasContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.4, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const gridHelper = new THREE.GridHelper(10, 10, 0x58a6ff, 0x30363d);
    scene.add(gridHelper);

    let characterGroup = null;
    let headBone = null;
    let chestBone = null;

    const imageInput = document.getElementById('imageInput');
    const statusBadge = document.getElementById('statusBadge');
    const webcamElement = document.getElementById('webcam');
    const startCamBtn = document.getElementById('startCamBtn');

    document.getElementById('bgDark').onclick = () => { scene.background = new THREE.Color(0x0d1117); gridHelper.visible = true; };
    document.getElementById('bgGreen').onclick = () => { scene.background = new THREE.Color(0x00ff00); gridHelper.visible = false; };
    document.getElementById('bgRed').onclick = () => { scene.background = new THREE.Color(0xff0000); gridHelper.visible = false; };
    document.getElementById('bgBlue').onclick = () => { scene.background = new THREE.Color(0x0000ff); gridHelper.visible = false; };

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => buildVtuberModel(img);
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    function buildVtuberModel(imgElement) {
        if (characterGroup) scene.remove(characterGroup);

        characterGroup = new THREE.Group();

        const canvas = document.createElement('canvas');
        canvas.width = imgElement.width;
        canvas.height = imgElement.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, 0, 0);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;

        const aspect = imgElement.height / imgElement.width;
        const totalH = 2.4;
        const totalW = totalH / aspect;

        // 胴体 (Chest) ボーン
        chestBone = new THREE.Group();
        chestBone.position.set(0, 1.0, 0);

        const chestGeo = new THREE.PlaneGeometry(totalW, totalH * 0.6);
        const chestMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        const chestMesh = new THREE.Mesh(chestGeo, chestMat);
        chestMesh.position.set(0, -0.2, 0);
        chestBone.add(chestMesh);

        // 頭部 (Head) ボーン：首元を回転軸の真中心（0, 0, 0）にする
        headBone = new THREE.Group();
        headBone.position.set(0, totalH * 0.25, 0.01); // 首の付け根の位置

        const headGeo = new THREE.PlaneGeometry(totalW, totalH * 0.5);
        const headMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        const headMesh = new THREE.Mesh(headGeo, headMat);
        headMesh.position.set(0, 0.1, 0); // 首元を中心としたオフセット値に修正
        headBone.add(headMesh);

        chestBone.add(headBone);
        characterGroup.add(chestBone);
        scene.add(characterGroup);

        statusBadge.innerText = "✨ VTuberモデル修正完了！カメラを起動してください";
    }

    let isTracking = false;
    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
            statusBadge.innerText = "🔍 顔を探しています...";
            return;
        }

        statusBadge.innerText = "🔴 VTuberトラッキング中！";
        const landmarks = results.multiFaceLandmarks[0];

        const nose = landmarks[1];
        const leftEye = landmarks[33];
        const rightEye = landmarks[263];

        const sens = parseFloat(document.getElementById('headSens').value);
        const bodySens = parseFloat(document.getElementById('bodySens').value);

        const deltaX = rightEye.x - leftEye.x;
        const deltaY = rightEye.y - leftEye.y;

        const roll = Math.atan2(deltaY, deltaX) * sens;
        const yaw = (0.5 - nose.x) * 1.8 * sens;
        const pitch = (nose.y - 0.5) * 1.5 * sens;

        if (headBone) {
            headBone.rotation.set(-pitch, -yaw, -roll);
        }

        if (chestBone) {
            chestBone.rotation.set(-pitch * bodySens, -yaw * bodySens, -roll * bodySens);
        }
    });

    startCamBtn.onclick = async () => {
        if (isTracking) return;
        statusBadge.innerText = "⏳ Webカメラを起動しています...";

        try {
            const cameraUtils = new Camera(webcamElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: webcamElement });
                },
                width: 640,
                height: 480
            });
            await cameraUtils.start();
            isTracking = true;
            startCamBtn.className = "bg-gray-600 text-white text-xs px-4 py-1.5 rounded font-bold cursor-not-allowed";
            startCamBtn.innerText = "🟢 トラッキング動作中";
        } catch (err) {
            statusBadge.innerText = "❌ カメラ起動エラー: " + err.message;
        }
    };

    document.getElementById('headSens').oninput = (e) => document.getElementById('headSensVal').innerText = e.target.value;
    document.getElementById('bodySens').oninput = (e) => document.getElementById('bodySensVal').innerText = e.target.value;

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
</body>
</html>
