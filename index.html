<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YuJitsu 3D Studio | Instant Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; overflow: hidden; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; }
        .input-ui { background: #010409; border: 1px solid #30363d; color: #c9d1d9; border-radius: 0.375rem; padding: 0.25rem 0.5rem; width: 100%; }
        .bg-btn { padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold; cursor: pointer; border: 1px solid #30363d; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-4 gap-4">

    <!-- ヘッダー -->
    <header class="flex justify-between items-center border-b border-[#30363d] pb-2 flex-none">
        <div>
            <h1 class="text-xl font-bold text-[#58a6ff]">YuJitsu 3D Studio <span class="text-xs text-gray-400 font-normal">Instant Edition</span></h1>
            <p class="text-xs text-gray-400">即時3D化・マルチモデル・.yj3d保存/復元対応スタジオ</p>
        </div>
        <div class="flex items-center gap-2">
            <!-- 背景色切り替え -->
            <span class="text-xs text-gray-400">背景:</span>
            <button id="bgDark" class="bg-btn bg-[#0d1117] text-white">Dark</button>
            <button id="bgGreen" class="bg-btn bg-[#00ff00] text-black">GB (緑)</button>
            <button id="bgRed" class="bg-btn bg-[#ff0000] text-white">RB (赤)</button>
            <button id="bgBlue" class="bg-btn bg-[#0000ff] text-white">BB (青)</button>
            
            <div class="h-4 w-[1px] bg-[#30363d] mx-1"></div>

            <!-- .yj3d 機能 -->
            <label class="bg-[#21262d] hover:bg-[#30363d] text-white text-xs px-3 py-1.5 rounded font-bold border border-[#30363d] cursor-pointer transition">
                📂 .yj3d 開く
                <input type="file" id="importYj3dInput" accept=".yj3d,application/json" class="hidden">
            </label>
            <button id="exportYj3dBtn" class="bg-[#8957e5] hover:bg-[#9d6cfa] text-white text-xs px-3 py-1.5 rounded font-bold transition disabled:opacity-50" disabled>
                💾 .yj3d 保存
            </button>

            <button id="clearAllBtn" class="bg-red-800 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded font-bold transition ml-2">
                🧹 全消去
            </button>
        </div>
    </header>

    <!-- メインエリア -->
    <div class="flex-1 flex gap-4 min-h-0">
        
        <!-- 左パネル -->
        <div class="w-80 panel p-4 flex flex-col gap-4 overflow-y-auto flex-none">
            
            <!-- ① 即時3Dモデル追加 -->
            <div class="border-b border-[#30363d] pb-3 space-y-2">
                <h2 class="text-sm font-bold text-[#79c0ff]">➕ 立ち絵を追加（即時3D化）</h2>
                <input type="file" id="imageInput" accept="image/*" class="input-ui text-xs cursor-pointer">
                <p class="text-[10px] text-gray-400">※画像を選ぶと即座に3D表示されます</p>
            </div>

            <!-- ② オブジェクト＆ボーン選択 -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs mb-1 text-[#79c0ff] font-bold">📦 操作オブジェクト選択</label>
                    <select id="modelSelect" class="input-ui text-xs">
                        <option value="">モデルがありません</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs mb-1 text-[#79c0ff] font-bold">🦴 操作パーツ（関節）選択</label>
                    <select id="boneSelect" class="input-ui text-xs">
                        <option value="">パーツを選択してください</option>
                    </select>
                </div>
            </div>

            <!-- ③ 回転スライダー -->
            <div class="space-y-3 bg-[#010409] p-3 rounded border border-[#30363d]">
                <div class="text-xs font-bold text-gray-300">関節角度 (deg)</div>
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400"><span>Z回転 (平面曲げ)</span><span id="rotZVal">0°</span></div>
                    <input type="range" id="rotZ" class="w-full" min="-180" max="180" value="0">
                </div>
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400"><span>X回転 (前後傾き)</span><span id="rotXVal">0°</span></div>
                    <input type="range" id="rotX" class="w-full" min="-60" max="60" value="0">
                </div>
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400"><span>Y回転 (左右振り)</span><span id="rotYVal">0°</span></div>
                    <input type="range" id="rotY" class="w-full" min="-60" max="60" value="0">
                </div>
            </div>

            <!-- 出力機能 -->
            <div class="mt-auto space-y-2 pt-2 border-t border-[#30363d]">
                <button id="capturePngBtn" class="bg-[#238636] hover:bg-[#2ea043] text-white text-xs px-3 py-2 rounded font-bold w-full transition">
                    📷 クロマキー画像出力 (PNG)
                </button>
            </div>
        </div>

        <!-- 右：3Dビューポート -->
        <div class="flex-1 panel relative overflow-hidden flex flex-col">
            <div id="canvasContainer" class="w-full flex-1"></div>
            <div id="statusBadge" class="absolute top-3 left-3 bg-[#010409]/90 px-3 py-1.5 rounded text-xs text-[#58a6ff] border border-[#30363d]">
                立ち絵画像を選択またはドロップしてください
            </div>
        </div>

    </div>

    <!-- 下部：タイムライン -->
    <div class="panel p-3 flex flex-col gap-2 flex-none">
        <div class="flex items-center gap-3">
            <button id="playBtn" class="bg-[#21262d] hover:bg-[#30363d] text-white text-xs px-4 py-1.5 rounded font-bold border border-[#30363d]">
                ▶ 再生
            </button>
            <span id="timeDisplay" class="text-xs font-mono text-[#58a6ff]">0.00s / 5.00s</span>
            <input type="range" id="timelineSlider" class="flex-1" min="0" max="5" step="0.033" value="0">
        </div>
    </div>

<script>
    const container = document.getElementById('canvasContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 4.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const gridHelper = new THREE.GridHelper(10, 10, 0x58a6ff, 0x30363d);
    scene.add(gridHelper);

    let modelsList = [];
    let activeModelIndex = -1;

    const imageInput = document.getElementById('imageInput');
    const modelSelect = document.getElementById('modelSelect');
    const boneSelect = document.getElementById('boneSelect');
    const statusBadge = document.getElementById('statusBadge');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const exportYj3dBtn = document.getElementById('exportYj3dBtn');
    const importYj3dInput = document.getElementById('importYj3dInput');

    // 背景切り替え
    document.getElementById('bgDark').onclick = () => { scene.background = new THREE.Color(0x0d1117); gridHelper.visible = true; };
    document.getElementById('bgGreen').onclick = () => { scene.background = new THREE.Color(0x00ff00); gridHelper.visible = false; };
    document.getElementById('bgRed').onclick = () => { scene.background = new THREE.Color(0xff0000); gridHelper.visible = false; };
    document.getElementById('bgBlue').onclick = () => { scene.background = new THREE.Color(0x0000ff); gridHelper.visible = false; };

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusBadge.innerText = "⏳ 画像を3Dモデル化中...";

        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                try {
                    create3DModel(img, file.name);
                } catch (err) {
                    statusBadge.innerText = "❌ エラー: " + err.message;
                }
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    function create3DModel(imgElement, fileName) {
        const imgW = imgElement.width;
        const imgH = imgElement.height;

        const aspect = imgH / imgW;
        const totalH = 2.4;
        const totalW = totalH / aspect;

        // Rootはメッシュなしの親ボーンとし、パーツだけ切り抜いて配置
        const partsDefinition = [
            { id: "root", name: "腰・全体 (Root)", parent: null, isPivotOnly: true, pivot: [0, 0, 0] },
            { id: "chest", name: "胸・胴体 (Chest)", parent: "root", crop: [imgW * 0.2, imgH * 0.35, imgW * 0.6, imgH * 0.45], pivot: [0, 0.6, 0.01], bounds: [totalW * 0.6, totalH * 0.45] },
            { id: "head", name: "頭部 (Head)", parent: "chest", crop: [imgW * 0.1, 0, imgW * 0.8, imgH * 0.45], pivot: [0, 0.65, 0.02], bounds: [totalW * 0.8, totalH * 0.45] },
            { id: "rArm", name: "右腕 (Right Arm)", parent: "chest", crop: [imgW * 0.6, imgH * 0.3, imgW * 0.35, imgH * 0.35], pivot: [totalW * 0.25, 0.1, 0.03], bounds: [totalW * 0.35, totalH * 0.35] },
            { id: "lArm", name: "左腕 (Left Arm)", parent: "chest", crop: [imgW * 0.05, imgH * 0.3, imgW * 0.35, imgH * 0.35], pivot: [-totalW * 0.25, 0.1, 0.03], bounds: [totalW * 0.35, totalH * 0.35] }
        ];

        const modelGroup = new THREE.Group();
        modelGroup.position.set(modelsList.length * 1.2, 0, 0);

        const bonesMap = {};
        const createdGroups = {};

        partsDefinition.forEach(p => {
            const boneGroup = new THREE.Group();
            boneGroup.position.set(...p.pivot);

            // 関節ピン
            const jointMark = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), new THREE.MeshBasicMaterial({ color: 0x58a6ff }));
            boneGroup.add(jointMark);

            // PivotOnly（Rootなど）以外は画像をメッシュ化
            if (!p.isPivotOnly) {
                const cropCanvas = document.createElement('canvas');
                cropCanvas.width = p.crop[2];
                cropCanvas.height = p.crop[3];
                const ctx = cropCanvas.getContext('2d');
                ctx.drawImage(imgElement, p.crop[0], p.crop[1], p.crop[2], p.crop[3], 0, 0, p.crop[2], p.crop[3]);

                const texture = new THREE.CanvasTexture(cropCanvas);
                texture.needsUpdate = true;

                const pW = p.bounds[0];
                const pH = p.bounds[1];
                const geo = new THREE.PlaneGeometry(pW, pH);
                const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });

                const mesh = new THREE.Mesh(geo, mat);
                boneGroup.add(mesh);
            }

            createdGroups[p.id] = boneGroup;
            bonesMap[p.id] = { group: boneGroup, data: p };
        });

        // 階層接続
        partsDefinition.forEach(p => {
            const currentGroup = createdGroups[p.id];
            if (p.parent && createdGroups[p.parent]) {
                createdGroups[p.parent].add(currentGroup);
            } else {
                modelGroup.add(currentGroup);
            }
        });

        scene.add(modelGroup);

        const modelObj = {
            id: Date.now(),
            name: fileName,
            group: modelGroup,
            bonesMap: bonesMap,
            partsDefinition: partsDefinition
        };

        modelsList.push(modelObj);
        updateModelDropdown();
        selectActiveModel(modelsList.length - 1);

        statusBadge.innerText = `✨ 「${fileName}」を3D化しました！`;
    }

    function updateModelDropdown() {
        modelSelect.innerHTML = "";
        modelsList.forEach((m, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = `${idx + 1}. ${m.name}`;
            modelSelect.appendChild(opt);
        });
    }

    function selectActiveModel(idx) {
        if (idx < 0 || idx >= modelsList.length) {
            activeModelIndex = -1;
            boneSelect.innerHTML = '<option value="">パーツを選択してください</option>';
            exportYj3dBtn.disabled = true;
            return;
        }

        activeModelIndex = idx;
        modelSelect.value = idx;

        boneSelect.innerHTML = '<option value="">パーツを選択してください</option>';
        modelsList[idx].partsDefinition.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.innerText = p.name;
            boneSelect.appendChild(opt);
        });
        exportYj3dBtn.disabled = false;
    }

    modelSelect.onchange = (e) => selectActiveModel(parseInt(e.target.value));

    clearAllBtn.onclick = () => {
        modelsList.forEach(m => scene.remove(m.group));
        modelsList = [];
        selectActiveModel(-1);
        imageInput.value = "";
        statusBadge.innerText = "🧹 すべての3Dモデルを消去しました";
    };

    // .yj3d 保存
    exportYj3dBtn.onclick = () => {
        if (activeModelIndex < 0 || !modelsList[activeModelIndex]) return;
        const currentModel = modelsList[activeModelIndex];
        const poseData = {};

        Object.keys(currentModel.bonesMap).forEach(bId => {
            const rot = currentModel.bonesMap[bId].group.rotation;
            poseData[bId] = {
                rotX: Math.round(THREE.MathUtils.radToDeg(rot.x)),
                rotY: Math.round(THREE.MathUtils.radToDeg(rot.y)),
                rotZ: Math.round(THREE.MathUtils.radToDeg(rot.z))
            };
        });

        const blob = new Blob([JSON.stringify({ name: currentModel.name, pose: poseData }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${currentModel.name}_pose.yj3d`;
        a.click();
    };

    // .yj3d 復元
    importYj3dInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (activeModelIndex >= 0 && modelsList[activeModelIndex] && data.pose) {
                    const currentModel = modelsList[activeModelIndex];
                    Object.keys(data.pose).forEach(bId => {
                        if (currentModel.bonesMap[bId]) {
                            const p = data.pose[bId];
                            currentModel.bonesMap[bId].group.rotation.set(
                                THREE.MathUtils.degToRad(p.rotX),
                                THREE.MathUtils.degToRad(p.rotY),
                                THREE.MathUtils.degToRad(p.rotZ)
                            );
                        }
                    });
                    statusBadge.innerText = `📂 ポーズデータを適用しました！`;
                }
            } catch (err) {
                alert("読み込み失敗");
            }
        };
        reader.readAsText(file);
    };

    // 回転スライダー
    const rotX = document.getElementById('rotX');
    const rotY = document.getElementById('rotY');
    const rotZ = document.getElementById('rotZ');

    function updateRotation() {
        if (activeModelIndex < 0) return;
        const boneId = boneSelect.value;
        const currentModel = modelsList[activeModelIndex];
        if (!boneId || !currentModel || !currentModel.bonesMap[boneId]) return;

        const valX = parseFloat(rotX.value);
        const valY = parseFloat(rotY.value);
        const valZ = parseFloat(rotZ.value);

        currentModel.bonesMap[boneId].group.rotation.set(
            THREE.MathUtils.degToRad(valX),
            THREE.MathUtils.degToRad(valY),
            THREE.MathUtils.degToRad(valZ)
        );

        document.getElementById('rotXVal').innerText = valX + '°';
        document.getElementById('rotYVal').innerText = valY + '°';
        document.getElementById('rotZVal').innerText = valZ + '°';
    }

    [rotX, rotY, rotZ].forEach(el => el.oninput = updateRotation);

    boneSelect.onchange = () => {
        if (activeModelIndex < 0) return;
        const boneId = boneSelect.value;
        const currentModel = modelsList[activeModelIndex];
        if (!boneId || !currentModel || !currentModel.bonesMap[boneId]) return;

        const r = currentModel.bonesMap[boneId].group.rotation;
        rotX.value = Math.round(THREE.MathUtils.radToDeg(r.x));
        rotY.value = Math.round(THREE.MathUtils.radToDeg(r.y));
        rotZ.value = Math.round(THREE.MathUtils.radToDeg(r.z));

        document.getElementById('rotXVal').innerText = rotX.value + '°';
        document.getElementById('rotYVal').innerText = rotY.value + '°';
        document.getElementById('rotZVal').innerText = rotZ.value + '°';
    };

    // 画像キャプチャ
    document.getElementById('capturePngBtn').onclick = () => {
        renderer.render(scene, camera);
        const a = document.createElement('a');
        a.href = renderer.domElement.toDataURL('image/png');
        a.download = `YuJitsu3D_${Date.now()}.png`;
        a.click();
    };

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
</body>
</html>
