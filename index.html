<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YuJitsu 3D Studio | 2.5D Live2D Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; overflow: hidden; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; }
        .input-ui { background: #010409; border: 1px solid #30363d; color: #c9d1d9; border-radius: 0.375rem; padding: 0.25rem 0.5rem; width: 100%; }
        .input-ui:focus { outline: none; border-color: #58a6ff; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-4 gap-4">

    <!-- ヘッダー -->
    <header class="flex justify-between items-center border-b border-[#30363d] pb-2 flex-none">
        <div>
            <h1 class="text-xl font-bold text-[#58a6ff]">YuJitsu 3D Studio <span class="text-xs text-gray-400 font-normal">Live2D Edition</span></h1>
            <p class="text-xs text-gray-400">2.5Dパーツ分離 ＆ 階層ボーンアニメーション</p>
        </div>
        <div class="flex gap-2">
            <button id="exportYj3dBtn" class="bg-[#8957e5] hover:bg-[#9d6cfa] text-white text-xs px-3 py-2 rounded font-bold transition disabled:opacity-50" disabled>
                💾 .yj3d モデル出力
            </button>
        </div>
    </header>

    <!-- メインエリア -->
    <div class="flex-1 flex gap-4 min-h-0">
        
        <!-- 左パネル -->
        <div class="w-80 panel p-4 flex flex-col gap-4 overflow-y-auto flex-none">
            
            <div class="border-b border-[#30363d] pb-3 space-y-2">
                <h2 class="text-sm font-bold text-[#79c0ff]">🖼️ 2D立ち絵から3Dボーン化</h2>
                <input type="file" id="imageInput" accept="image/*" class="input-ui text-xs">
                
                <div id="imgPreviewBox" class="w-full h-28 bg-black border border-[#30363d] rounded flex items-center justify-center overflow-hidden hidden">
                    <img id="imgPreview" class="max-h-full max-w-full object-contain">
                </div>

                <button id="convertBtn" class="bg-[#238636] hover:bg-[#2ea043] text-white text-xs px-3 py-2 rounded font-bold w-full transition disabled:opacity-50" disabled>
                    ✨ 2.5Dモデルを生成して表示！
                </button>
            </div>

            <div>
                <h2 class="text-sm font-bold text-[#79c0ff] mb-2">🦴 関節（ボーン）操作</h2>
                <label class="block text-xs mb-1 text-gray-400">操作するパーツ</label>
                <select id="boneSelect" class="input-ui text-xs">
                    <option value="">パーツを選択してください</option>
                </select>
            </div>

            <!-- 回転スライダー (X, Y, Z 完全復活) -->
            <div class="space-y-3 bg-[#010409] p-3 rounded border border-[#30363d]">
                <div class="text-xs font-bold text-gray-300">関節角度 (deg)</div>
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400"><span>Z回転 (平面関節回転)</span><span id="rotZVal">0°</span></div>
                    <input type="range" id="rotZ" class="w-full" min="-180" max="180" value="0">
                </div>
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400"><span>X回転 (前後傾き)</span><span id="rotXVal">0°</span></div>
                    <input type="range" id="rotX" class="w-full" min="-60" max="60" value="0">
                </div>
                <div>
                    <div class="flex justify-between text-[10px] text-gray-400"><span>Y回転 (左右振り)</span><span id="rotYVal">0°</span></div>
                    <input type="range" id="rotY" class="w-full" min="-60" max="60" value="0">
                </div>
            </div>

            <button id="addKeyframeBtn" class="bg-[#8957e5] hover:bg-[#9d6cfa] text-white text-xs px-3 py-2 rounded font-bold w-full transition mt-auto">
                ♦ 現在のポーズをキーフレーム保存
            </button>
        </div>

        <!-- 右：3Dビューポート -->
        <div class="flex-1 panel relative overflow-hidden flex flex-col">
            <div id="canvasContainer" class="w-full flex-1"></div>
            <div id="statusBadge" class="absolute top-3 left-3 bg-[#010409]/90 px-3 py-1.5 rounded text-xs text-[#58a6ff] border border-[#30363d]">
                立ち絵画像を選択してください
            </div>
        </div>

    </div>

    <!-- 下部：タイムライン -->
    <div class="panel p-3 flex flex-col gap-2 flex-none">
        <div class="flex items-center gap-3">
            <button id="playBtn" class="bg-[#21262d] hover:bg-[#30363d] text-white text-xs px-4 py-1.5 rounded font-bold border border-[#30363d]">
                ▶ 再生
            </button>
            <span id="timeDisplay" class="text-xs font-mono text-[#58a6ff]">0.00s / 5.00s</span>
            <input type="range" id="timelineSlider" class="flex-1" min="0" max="5" step="0.033" value="0">
        </div>
    </div>

<script>
    const container = document.getElementById('canvasContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 4.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    scene.add(new THREE.GridHelper(10, 10, 0x58a6ff, 0x30363d));

    let characterRootGroup = null;
    let bonesMap = {};
    let loadedImage = null;
    let currentYj3dData = null;

    const imageInput = document.getElementById('imageInput');
    const imgPreviewBox = document.getElementById('imgPreviewBox');
    const imgPreview = document.getElementById('imgPreview');
    const convertBtn = document.getElementById('convertBtn');
    const exportYj3dBtn = document.getElementById('exportYj3dBtn');
    const statusBadge = document.getElementById('statusBadge');
    const boneSelect = document.getElementById('boneSelect');

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                loadedImage = img;
                imgPreview.src = ev.target.result;
                imgPreviewBox.classList.remove('hidden');
                convertBtn.disabled = false;
                statusBadge.innerText = `✅ 画像ロード完了 (${img.width}x${img.height})`;
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    convertBtn.addEventListener('click', () => {
        if (!loadedImage) return;

        const texture = new THREE.CanvasTexture(loadedImage);
        texture.needsUpdate = true;

        const aspect = loadedImage.height / loadedImage.width;
        const totalH = 2.4;
        const totalW = totalH / aspect;

        // 階層ボーン＆UV切り出しパーツ構造定義
        const partsDefinition = [
            { id: "root", name: "腰・全体 (Root)", parent: null, uv: [0, 0, 1, 1], pivot: [0, 0, 0], bounds: [totalW, totalH] },
            { id: "chest", name: "胸・胴体 (Chest)", parent: "root", uv: [0.15, 0.2, 0.7, 0.45], pivot: [0, 0.8, 0.01], bounds: [totalW * 0.7, totalH * 0.45] },
            { id: "head", name: "頭部 (Head)", parent: "chest", uv: [0.05, 0.55, 0.9, 0.45], pivot: [0, 0.6, 0.02], bounds: [totalW * 0.9, totalH * 0.45] },
            { id: "rArm", name: "右腕 (Right Arm)", parent: "chest", uv: [0.55, 0.25, 0.4, 0.4], pivot: [totalW * 0.3, 0.4, 0.03], bounds: [totalW * 0.4, totalH * 0.4] },
            { id: "lArm", name: "左腕 (Left Arm)", parent: "chest", uv: [0.05, 0.25, 0.4, 0.4], pivot: [-totalW * 0.3, 0.4, 0.03], bounds: [totalW * 0.4, totalH * 0.4] }
        ];

        currentYj3dData = { version: "2.0_Live2D", bones: partsDefinition };
        build25DSlicedModel(texture, partsDefinition, totalW, totalH);
        statusBadge.innerText = "✨ 表示成功！パーツを選択して回転できます。";
        exportYj3dBtn.disabled = false;
    });

    function build25DSlicedModel(texture, parts, totalW, totalH) {
        if (characterRootGroup) scene.remove(characterRootGroup);
        characterRootGroup = new THREE.Group();
        bonesMap = {};
        boneSelect.innerHTML = '<option value="">パーツを選択してください</option>';

        parts.forEach(p => {
            const boneGroup = new THREE.Group();
            boneGroup.position.set(...p.pivot);

            const pW = p.bounds[0];
            const pH = p.bounds[1];
            const geo = new THREE.PlaneGeometry(pW, pH);

            // UVパーツ切り出しマッピング
            const uvAttr = geo.attributes.uv;
            for (let i = 0; i < uvAttr.count; i++) {
                let u = uvAttr.getX(i);
                let v = uvAttr.getY(i);
                u = p.uv[0] + u * p.uv[2];
                v = p.uv[1] + v * p.uv[3];
                uvAttr.setXY(i, u, v);
            }

            const mat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide
            });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, (p.id === 'root') ? totalH / 2 : 0, 0);
            boneGroup.add(mesh);

            // 関節位置の青いインジケーターピン
            const jointMark = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x58a6ff })
            );
            boneGroup.add(jointMark);

            bonesMap[p.id] = { group: boneGroup, mesh: mesh, data: p };

            const opt = document.createElement('option');
            opt.value = p.id;
            opt.innerText = p.name;
            boneSelect.appendChild(opt);
        });

        // 階層ボーン（親子接続）
        parts.forEach(p => {
            if (p.parent && bonesMap[p.parent]) {
                bonesMap[p.parent].group.add(bonesMap[p].group);
            } else {
                characterRootGroup.add(bonesMap[p].group);
            }
        });

        scene.add(characterRootGroup);

        camera.position.set(0, totalH / 2, totalH * 1.5);
        controls.target.set(0, totalH / 2, 0);
        controls.update();
    }

    // スライダー＆角度同期処理
    const rotX = document.getElementById('rotX');
    const rotY = document.getElementById('rotY');
    const rotZ = document.getElementById('rotZ');

    function updateRotation() {
        const id = boneSelect.value;
        if (!id || !bonesMap[id]) return;

        const valX = parseFloat(rotX.value);
        const valY = parseFloat(rotY.value);
        const valZ = parseFloat(rotZ.value);

        const targetGroup = bonesMap[id].group;
        // 軸方向を修正（X, Y, Zを正しい回転軸に対応）
        targetGroup.rotation.set(
            THREE.MathUtils.degToRad(valX),
            THREE.MathUtils.degToRad(valY),
            THREE.MathUtils.degToRad(valZ)
        );

        document.getElementById('rotXVal').innerText = valX + '°';
        document.getElementById('rotYVal').innerText = valY + '°';
        document.getElementById('rotZVal').innerText = valZ + '°';
    }

    [rotX, rotY, rotZ].forEach(el => el.addEventListener('input', updateRotation));

    boneSelect.addEventListener('change', () => {
        const id = boneSelect.value;
        if (!id || !bonesMap[id]) return;

        const targetGroup = bonesMap[id].group;
        const r = targetGroup.rotation;

        const degX = Math.round(THREE.MathUtils.radToDeg(r.x));
        const degY = Math.round(THREE.MathUtils.radToDeg(r.y));
        const degZ = Math.round(THREE.MathUtils.radToDeg(r.z));

        rotX.value = degX;
        rotY.value = degY;
        rotZ.value = degZ;

        document.getElementById('rotXVal').innerText = degX + '°';
        document.getElementById('rotYVal').innerText = degY + '°';
        document.getElementById('rotZVal').innerText = degZ + '°';
    });

    exportYj3dBtn.addEventListener('click', () => {
        if (!currentYj3dData) return;
        const blob = new Blob([JSON.stringify(currentYj3dData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `model_${Date.now()}.yj3d`; a.click();
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
</body>
</html>
