<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YuJitsu Studio | Ctrl+Z Undo & Full VTuber Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; overflow: hidden; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; }
        .input-ui { background: #010409; border: 1px solid #30363d; color: #c9d1d9; border-radius: 0.375rem; padding: 0.25rem 0.5rem; width: 100%; }
        .btn-part { padding: 0.5rem 0.25rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: bold; border: 1px solid #30363d; text-align: center; cursor: pointer; transition: all 0.2s; }
        .btn-part.active { border-color: #58a6ff; ring: 2px; }
        .btn-mode { font-size: 0.75rem; padding: 0.375rem 0.5rem; border-radius: 0.375rem; font-weight: bold; border: 1px solid #30363d; cursor: pointer; text-align: center; }
        .btn-mode.active { border-color: #58a6ff; color: #ffffff; background-color: #21262d; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-4 gap-4">

    <!-- ヘッダー -->
    <header class="flex justify-between items-center border-b border-[#30363d] pb-2 flex-none">
        <div>
            <h1 class="text-xl font-bold text-[#58a6ff]">YuJitsu Studio <span class="text-xs text-green-400 font-normal">Undo(Ctrl+Z) Supported</span></h1>
            <p class="text-xs text-gray-400">ペン・バケツ・消しゴム ＆ Ctrl+Z対応 フル機能VTuberスタジオ</p>
        </div>
        <div class="flex items-center gap-2">
            <button id="startCamBtn" class="bg-[#238636] hover:bg-[#2ea043] text-white text-xs px-4 py-2 rounded font-bold transition">
                📹 Webカメラトラッキング開始
            </button>
        </div>
    </header>

    <!-- メインエリア -->
    <div class="flex-1 flex gap-4 min-h-0">
        
        <!-- 左：操作パネル -->
        <div class="w-80 panel p-4 flex flex-col gap-3 overflow-y-auto flex-none">
            
            <div class="space-y-1 border-b border-[#30363d] pb-3">
                <label class="text-xs font-bold text-[#79c0ff]">1. 立ち絵読み込み</label>
                <input type="file" id="imageInput" accept="image/*" class="input-ui text-xs cursor-pointer">
            </div>

            <!-- ツール選択 -->
            <div class="space-y-2 border-b border-[#30363d] pb-3">
                <label class="text-xs font-bold text-[#79c0ff]">2. 描画ツール選択</label>
                <div class="grid grid-cols-3 gap-1.5">
                    <button id="modeBrush" class="btn-mode active">🖌️ ペン</button>
                    <button id="modeFill" class="btn-mode">🪣 バケツ</button>
                    <button id="modeEraser" class="btn-mode text-red-300">🧹 消しゴム</button>
                </div>
                <div id="brushOption" class="flex items-center gap-2 pt-1">
                    <span class="text-[10px] text-gray-400">太さ:</span>
                    <input type="range" id="brushSize" min="2" max="60" value="20" class="flex-1">
                </div>
            </div>

            <!-- パーツ選択 -->
            <div class="space-y-2 border-b border-[#30363d] pb-3">
                <label class="text-xs font-bold text-[#79c0ff]">3. 塗り分ける部位を選択</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="partHead" class="btn-part bg-red-900/40 text-red-300 border-red-500 active">🔴 頭部</button>
                    <button id="partBody" class="btn-part bg-blue-900/40 text-blue-300 border-blue-500">🔵 胴体</button>
                    <button id="partEyes" class="btn-part bg-yellow-900/40 text-yellow-300 border-yellow-500">🟡 目 (まばたき)</button>
                    <button id="partMouth" class="btn-part bg-green-900/40 text-green-300 border-green-500">🟢 口 (パクパク)</button>
                </div>

                <!-- Ctrl+Z Undo / Redo ボタン -->
                <div class="flex gap-2 pt-2">
                    <button id="undoBtn" class="flex-1 bg-[#21262d] hover:bg-[#30363d] text-white text-xs py-1.5 rounded font-bold border border-[#30363d]">↩️ 戻す (Ctrl+Z)</button>
                    <button id="redoBtn" class="flex-1 bg-[#21262d] hover:bg-[#30363d] text-white text-xs py-1.5 rounded font-bold border border-[#30363d]">↪️ やり直し</button>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <button id="clearPaintBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-[10px] px-3 py-1 rounded w-full">全消しリセット</button>
                </div>
            </div>

            <button id="buildModelBtn" class="bg-[#8957e5] hover:bg-[#9d6cfa] text-white text-xs px-3 py-3 rounded font-bold transition w-full shadow-lg">
                ✨ 塗った部位で3D化 ＆ トラッキング準備！
            </button>
        </div>

        <!-- 中央：キャンバス & 右：3Dプレビュー -->
        <div class="flex-1 flex gap-4 min-h-0">
            <!-- ペイントエリア -->
            <div class="flex-1 panel relative flex flex-col items-center justify-center p-2 bg-[#010409]">
                <div class="text-xs text-gray-400 absolute top-2 left-2 z-10">🎨 マスクペイント (Ctrl+Zで操作を取り消せます)</div>
                <div class="relative max-h-full max-w-full flex items-center justify-center overflow-hidden">
                    <canvas id="paintCanvas" class="max-h-[70vh] max-w-full border border-gray-700 cursor-crosshair"></canvas>
                </div>
            </div>

            <!-- 3Dビューポート -->
            <div class="flex-1 panel relative overflow-hidden flex flex-col">
                <div id="canvasContainer" class="w-full flex-1"></div>
                <video id="webcam" class="hidden" autoplay playsinline></video>
                <div id="statusBadge" class="absolute top-3 left-3 bg-[#010409]/90 px-3 py-1.5 rounded text-xs text-[#58a6ff] border border-[#30363d]">
                    画像を選択してパーツを塗ってください
                </div>
            </div>
        </div>

    </div>

<script>
    // --- 1. ペイント ＆ Ctrl+Z (Undo / Redo) エンジン ---
    const paintCanvas = document.getElementById('paintCanvas');
    const paintCtx = paintCanvas.getContext('2d');
    let loadedImage = null;

    let drawMode = 'brush'; // 'brush', 'fill', 'eraser'
    let currentPart = 'head'; // 'head', 'body', 'eyes', 'mouth'
    let isDrawing = false;
    let brushSize = 20;

    const maskCanvases = {
        head: document.createElement('canvas'),
        body: document.createElement('canvas'),
        eyes: document.createElement('canvas'),
        mouth: document.createElement('canvas')
    };
    const maskCtxs = {
        head: maskCanvases.head.getContext('2d'),
        body: maskCanvases.body.getContext('2d'),
        eyes: maskCanvases.eyes.getContext('2d'),
        mouth: maskCanvases.mouth.getContext('2d')
    };

    // Undo / Redo スタック履歴
    const undoStack = [];
    const redoStack = [];
    const maxHistory = 20;

    function saveState() {
        const state = {};
        Object.keys(maskCanvases).forEach(part => {
            const temp = document.createElement('canvas');
            temp.width = maskCanvases[part].width;
            temp.height = maskCanvases[part].height;
            temp.getContext('2d').drawImage(maskCanvases[part], 0, 0);
            state[part] = temp;
        });

        undoStack.push(state);
        if (undoStack.length > maxHistory) undoStack.shift();
        redoStack.length = 0; // 新しい操作が入ったらRedo履歴をクリア
    }

    function undo() {
        if (undoStack.length === 0) return;
        const currentState = {};
        Object.keys(maskCanvases).forEach(part => {
            const temp = document.createElement('canvas');
            temp.width = maskCanvases[part].width;
            temp.height = maskCanvases[part].height;
            temp.getContext('2d').drawImage(maskCanvases[part], 0, 0);
            currentState[part] = temp;
        });
        redoStack.push(currentState);

        const previousState = undoStack.pop();
        restoreState(previousState);
    }

    function redo() {
        if (redoStack.length === 0) return;
        const currentState = {};
        Object.keys(maskCanvases).forEach(part => {
            const temp = document.createElement('canvas');
            temp.width = maskCanvases[part].width;
            temp.height = maskCanvases[part].height;
            temp.getContext('2d').drawImage(maskCanvases[part], 0, 0);
            currentState[part] = temp;
        });
        undoStack.push(currentState);

        const nextState = redoStack.pop();
        restoreState(nextState);
    }

    function restoreState(state) {
        Object.keys(state).forEach(part => {
            const ctx = maskCtxs[part];
            ctx.clearRect(0, 0, maskCanvases[part].width, maskCanvases[part].height);
            ctx.drawImage(state[part], 0, 0);
        });
        redrawPaintCanvas();
    }

    // Ctrl+Z / Ctrl+Y のキーボードショートカット対応
    window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            if (e.shiftKey) {
                redo();
            } else {
                undo();
            }
            e.preventDefault();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
            redo();
            e.preventDefault();
        }
    });

    document.getElementById('undoBtn').onclick = undo;
    document.getElementById('redoBtn').onclick = redo;

    const modeBtns = {
        brush: document.getElementById('modeBrush'),
        fill: document.getElementById('modeFill'),
        eraser: document.getElementById('modeEraser')
    };

    Object.keys(modeBtns).forEach(m => {
        modeBtns[m].onclick = () => {
            drawMode = m;
            Object.values(modeBtns).forEach(b => b.classList.remove('active'));
            modeBtns[m].classList.add('active');
        };
    });

    const partBtns = { 
        head: document.getElementById('partHead'), 
        body: document.getElementById('partBody'), 
        eyes: document.getElementById('partEyes'),
        mouth: document.getElementById('partMouth')
    };
    Object.keys(partBtns).forEach(part => {
        partBtns[part].onclick = () => {
            currentPart = part;
            Object.values(partBtns).forEach(b => b.classList.remove('active', 'ring-2'));
            partBtns[part].classList.add('active', 'ring-2');
        };
    });

    document.getElementById('brushSize').oninput = (e) => brushSize = parseInt(e.target.value);

    document.getElementById('imageInput').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            loadedImage = new Image();
            loadedImage.onload = () => {
                const w = loadedImage.width;
                const h = loadedImage.height;

                paintCanvas.width = w;
                paintCanvas.height = h;
                Object.keys(maskCanvases).forEach(k => {
                    maskCanvases[k].width = w;
                    maskCanvases[k].height = h;
                });

                undoStack.length = 0;
                redoStack.length = 0;
                resetPaintCanvas();
            };
            loadedImage.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    function resetPaintCanvas() {
        if (!loadedImage) return;
        paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
        paintCtx.drawImage(loadedImage, 0, 0);
        Object.values(maskCtxs).forEach(ctx => ctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height));
    }
    document.getElementById('clearPaintBtn').onclick = () => {
        saveState();
        resetPaintCanvas();
    };

    function getCanvasCoords(e) {
        const rect = paintCanvas.getBoundingClientRect();
        const scaleX = paintCanvas.width / rect.width;
        const scaleY = paintCanvas.height / rect.height;
        return {
            x: Math.floor((e.clientX - rect.left) * scaleX),
            y: Math.floor((e.clientY - rect.top) * scaleY)
        };
    }

    paintCanvas.onmousedown = (e) => {
        if (!loadedImage) return;
        saveState(); // 描画開始前に現在の状態を保存
        const { x, y } = getCanvasCoords(e);
        if (drawMode === 'fill') {
            floodFill(x, y);
        } else {
            isDrawing = true;
            drawBrush(x, y);
        }
    };
    paintCanvas.onmousemove = (e) => {
        if (isDrawing && (drawMode === 'brush' || drawMode === 'eraser')) {
            const { x, y } = getCanvasCoords(e);
            drawBrush(x, y);
        }
    };
    paintCanvas.onmouseup = () => isDrawing = false;

    function drawBrush(x, y) {
        const maskCtx = maskCtxs[currentPart];

        if (drawMode === 'eraser') {
            maskCtx.save();
            maskCtx.globalCompositeOperation = 'destination-out';
            maskCtx.beginPath();
            maskCtx.arc(x, y, brushSize, 0, Math.PI * 2);
            maskCtx.fill();
            maskCtx.restore();

            redrawPaintCanvas();
        } else {
            const colorMap = { 
                head: 'rgba(255, 0, 0, 0.5)', 
                body: 'rgba(0, 100, 255, 0.5)', 
                eyes: 'rgba(255, 230, 0, 0.6)',
                mouth: 'rgba(0, 255, 100, 0.6)'
            };
            
            paintCtx.fillStyle = colorMap[currentPart];
            paintCtx.beginPath();
            paintCtx.arc(x, y, brushSize, 0, Math.PI * 2);
            paintCtx.fill();

            maskCtx.fillStyle = '#ffffff';
            maskCtx.beginPath();
            maskCtx.arc(x, y, brushSize, 0, Math.PI * 2);
            maskCtx.fill();
        }
    }

    function redrawPaintCanvas() {
        if (!loadedImage) return;
        paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
        paintCtx.drawImage(loadedImage, 0, 0);

        const colorMap = { 
            head: 'rgba(255, 0, 0, 0.5)', 
            body: 'rgba(0, 100, 255, 0.5)', 
            eyes: 'rgba(255, 230, 0, 0.6)',
            mouth: 'rgba(0, 255, 100, 0.6)'
        };

        Object.keys(maskCanvases).forEach(part => {
            const overlay = document.createElement('canvas');
            overlay.width = paintCanvas.width;
            overlay.height = paintCanvas.height;
            const oCtx = overlay.getContext('2d');

            oCtx.fillStyle = colorMap[part];
            oCtx.fillRect(0, 0, overlay.width, overlay.height);
            oCtx.globalCompositeOperation = 'destination-in';
            oCtx.drawImage(maskCanvases[part], 0, 0);

            paintCtx.drawImage(overlay, 0, 0);
        });
    }

    function floodFill(startX, startY) {
        const w = paintCanvas.width;
        const h = paintCanvas.height;
        const imgData = paintCtx.getImageData(0, 0, w, h);
        const data = imgData.data;

        const startIdx = (startY * w + startX) * 4;
        const startR = data[startIdx], startG = data[startIdx + 1], startB = data[startIdx + 2], startA = data[startIdx + 3];

        if (startA === 0) return;

        const maskCtx = maskCtxs[currentPart];
        const maskImgData = maskCtx.getImageData(0, 0, w, h);
        const maskData = maskImgData.data;

        const queue = [[startX, startY]];
        const visited = new Uint8Array(w * h);
        const colorTolerance = 35;

        while (queue.length > 0) {
            const [x, y] = queue.pop();
            const idx = (y * w + x);
            if (visited[idx]) continue;
            visited[idx] = 1;

            const pxIdx = idx * 4;
            const r = data[pxIdx], g = data[pxIdx + 1], b = data[pxIdx + 2], a = data[pxIdx + 3];

            if (Math.abs(r - startR) <= colorTolerance &&
                Math.abs(g - startG) <= colorTolerance &&
                Math.abs(b - startB) <= colorTolerance &&
                a > 10) {

                maskData[pxIdx] = 255; maskData[pxIdx + 1] = 255; maskData[pxIdx + 2] = 255; maskData[pxIdx + 3] = 255;

                if (x > 0) queue.push([x - 1, y]);
                if (x < w - 1) queue.push([x + 1, y]);
                if (y > 0) queue.push([x, y - 1]);
                if (y < h - 1) queue.push([x, y + 1]);
            }
        }

        maskCtx.putImageData(maskImgData, 0, 0);
        redrawPaintCanvas();
    }

    // --- 2. Three.js 3D構築 ---
    const container = document.getElementById('canvasContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));

    let characterGroup = null;
    let headBone = null;
    let chestBone = null;
    let eyesMesh = null;
    let mouthMesh = null;

    document.getElementById('buildModelBtn').onclick = () => {
        if (!loadedImage) return;

        if (characterGroup) scene.remove(characterGroup);
        characterGroup = new THREE.Group();

        const aspect = loadedImage.height / loadedImage.width;
        const totalH = 2.4;
        const totalW = totalH / aspect;

        // 胴体
        const bodyCanvas = extractMaskedTexture(loadedImage, maskCanvases.body);
        chestBone = new THREE.Group();
        chestBone.position.set(0, 0.5, 0);
        const bodyMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(totalW, totalH),
            new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(bodyCanvas), transparent: true, side: THREE.DoubleSide })
        );
        bodyMesh.position.set(0, totalH / 2 - 0.5, 0);
        chestBone.add(bodyMesh);

        // 頭部
        const headCanvas = extractMaskedTexture(loadedImage, maskCanvases.head);
        headBone = new THREE.Group();
        headBone.position.set(0, totalH * 0.5, 0.01);
        const headMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(totalW, totalH),
            new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(headCanvas), transparent: true, side: THREE.DoubleSide })
        );
        headMesh.position.set(0, totalH / 2 - (totalH * 0.5), 0);
        headBone.add(headMesh);

        // 目
        const eyesCanvas = extractMaskedTexture(loadedImage, maskCanvases.eyes);
        eyesMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(totalW, totalH),
            new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(eyesCanvas), transparent: true, side: THREE.DoubleSide })
        );
        eyesMesh.position.set(0, totalH / 2 - (totalH * 0.5), 0.01);
        headBone.add(eyesMesh);

        // 口
        const mouthCanvas = extractMaskedTexture(loadedImage, maskCanvases.mouth);
        mouthMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(totalW, totalH),
            new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(mouthCanvas), transparent: true, side: THREE.DoubleSide })
        );
        mouthMesh.position.set(0, totalH / 2 - (totalH * 0.5), 0.02);
        headBone.add(mouthMesh);

        chestBone.add(headBone);
        characterGroup.add(chestBone);
        scene.add(characterGroup);

        document.getElementById('statusBadge').innerText = "✨ Undo機能付き 3Dモデル化が完了しました！";
    };

    function extractMaskedTexture(sourceImg, maskCanvas) {
        const outCanvas = document.createElement('canvas');
        outCanvas.width = sourceImg.width;
        outCanvas.height = sourceImg.height;
        const ctx = outCanvas.getContext('2d');
        ctx.drawImage(sourceImg, 0, 0);
        ctx.globalCompositeOperation = 'destination-in';
        ctx.drawImage(maskCanvas, 0, 0);
        return outCanvas;
    }

    // --- 3. Webカメラ トラッキング ---
    let isTracking = false;
    const webcamElement = document.getElementById('webcam');
    const faceMesh = new FaceMesh({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });

    faceMesh.onResults((results) => {
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;
        const landmarks = results.multiFaceLandmarks[0];

        const nose = landmarks[1];
        const leftEye = landmarks[33];
        const rightEye = landmarks[263];

        const deltaX = rightEye.x - leftEye.x;
        const deltaY = rightEye.y - leftEye.y;

        const roll = Math.atan2(deltaY, deltaX) * 1.2;
        const yaw = (0.5 - nose.x) * 1.8;
        const pitch = (nose.y - 0.5) * 1.5;

        if (headBone) headBone.rotation.set(-pitch, -yaw, -roll);
        if (chestBone) chestBone.rotation.set(-pitch * 0.3, -yaw * 0.3, -roll * 0.3);

        const leftEyeDist = Math.hypot(landmarks[159].x - landmarks[145].x, landmarks[159].y - landmarks[145].y);
        const rightEyeDist = Math.hypot(landmarks[386].x - landmarks[374].x, landmarks[386].y - landmarks[374].y);
        const avgEyeDist = (leftEyeDist + rightEyeDist) / 2;

        if (eyesMesh) {
            eyesMesh.scale.y = avgEyeDist < 0.015 ? 0.05 : 1.0;
        }

        const mouthDist = Math.hypot(landmarks[13].x - landmarks[14].x, landmarks[13].y - landmarks[14].y);
        if (mouthMesh) {
            const mouthScale = Math.max(0.1, Math.min(2.5, mouthDist * 25));
            mouthMesh.scale.y = mouthScale;
        }
    });

    document.getElementById('startCamBtn').onclick = async () => {
        if (isTracking) return;
        const cameraUtils = new Camera(webcamElement, {
            onFrame: async () => { await faceMesh.send({ image: webcamElement }); },
            width: 640, height: 480
        });
        await cameraUtils.start();
        isTracking = true;
        document.getElementById('startCamBtn').innerText = "🟢 トラッキング動作中";
    };

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
